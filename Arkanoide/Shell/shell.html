<!doctype html>

<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Arkanoide</title>
        
        <style>
            html, body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                height: 100%;
                background: radial-gradient(circle at 50% 40%, #4b0a91 0%, #1a0533 45%, #0a0014 100%);
            }
            #canvas-container {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100vw;
                height: 100vh;
                position: relative;
            }
            #canvas-container::before {
                content: "";
                position: absolute;
                width: min(70vw, 70vh);
                height: min(70vw, 70vh);
                background: radial-gradient(circle, rgba(191, 0, 255, 0.35) 0%, rgba(191, 0, 255, 0) 70%);
                filter: blur(20px);
                z-index: 0;
            }
            #canvas {
                object-fit: contain;
                width: 100%;
                height: 100%;
                position: relative;
                z-index: 1;
            }
            #canvas-container:fullscreen {
                background: radial-gradient(circle at 50% 40%, #4b0a91 0%, #1a0533 45%, #0a0014 100%);
            }
            #fullscreen-btn {
                position: fixed;
                top: 10px;
                right: 10px;
                z-index: 10;
                padding: 8px 12px;
                cursor: pointer;
                background: #2d0a4e;
                color: #e0b3ff;
                border: 1px solid #bf00ff;
                border-radius: 6px;
            }
            #fullscreen-btn:hover {
                background: #3d0f66;
            }
        </style>
    </head>

    <body>
        <div id="canvas-container">
            <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
        </div>

        <script>
            var Module = {
                canvas: document.getElementById('canvas'),
                        onRuntimeInitialized: function() {
                            Module.canvas.focus();
                        }};

            Module.canvas.addEventListener("click", function() {
                        Module.canvas.focus();
            });
        </script>
        {{{ SCRIPT }}}
    </body>
</html>
